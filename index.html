<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Decision recorded</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #E8E8E8; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 24px; padding: 48px 32px; max-width: 420px; width: 100%; text-align: center; box-sizing: border-box; }
  .icon { width: 64px; height: 64px; line-height: 64px; border-radius: 50%; margin: 0 auto 20px; color: #fff; font-size: 30px; font-weight: 700; background: #000; }
  h1 { margin: 0 0 10px; font-family: Georgia, 'Times New Roman', serif; font-size: 28px; line-height: 34px; color: #000; }
  p { margin: 0; font-size: 16px; line-height: 24px; color: #555; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">&#10003;</div>
    <h1 id="title">Decision recorded</h1>
    <p>Your decision has been saved. You can close this tab.</p>
  </div>
  <script>
    var s = (new URLSearchParams(location.search).get('status') || '').toLowerCase();
    var map = {
      approved: { t: 'Request approved', c: '#1E7B3A', i: '\u2713' },
      rejected: { t: 'Request rejected', c: '#C62828', i: '\u2715' }
    };
    var m = map[s];
    if (m) {
      document.getElementById('title').textContent = m.t;
      document.getElementById('icon').textContent = m.i;
      document.getElementById('icon').style.background = m.c;
    }
  </script>
</body>
</html>
